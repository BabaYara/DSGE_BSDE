name: lean-minted-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lean project
        id: lean
        uses: leanprover/lean-action@v1
        with:
          build: true
          lean4checker: true

      - name: Fail on sorry/admit tokens
        run: |
          set -euo pipefail
          if git ls-files '*.lean' | xargs -r rg -n '\\b(sorry|admit)\\b'; then
            echo '::error ::Found sorry/admit in Lean sources';
            exit 1;
          fi

      - name: Generate verification banner
        run: |
          mkdir -p build
          COMMIT=$(git rev-parse --short=12 HEAD)
          TOOLCHAIN=$(cat lean/lean-toolchain | tr -d '\n' || echo 'unknown')
          DATE=$(date -u +"%Y-%m-%d %H:%M:%SZ")
          cat <<'EOF' > build/verified.tex
% auto-generated by CI
\newcommand{\LeanVerifiedBanner}{%
  \begingroup\footnotesize
  \noindent\textbf{Lean verification: }
  commit \texttt{COMMIT_PLACEHOLDER};
  toolchain \texttt{TOOLCHAIN_PLACEHOLDER};
  built at DATE_PLACEHOLDER (UTC);
  no-sorry: true;
  pipeline: lake build -> lean4checker.
  \endgroup
}
\LeanVerifiedBanner
EOF
          sed -i "s/COMMIT_PLACEHOLDER/${COMMIT}/" build/verified.tex
          sed -i "s/TOOLCHAIN_PLACEHOLDER/${TOOLCHAIN}/" build/verified.tex
          sed -i "s/DATE_PLACEHOLDER/${DATE}/" build/verified.tex

      - name: Upload verification stamp
        uses: actions/upload-artifact@v4
        with:
          name: verified-stamp
          path: build/verified.tex

  latex:
    needs: lean
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verification stamp
        uses: actions/download-artifact@v4
        with:
          name: verified-stamp
          path: build

      - name: Compile LaTeX (XeLaTeX + minted)
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: Tex
          root_file: BSDE_31.tex
          latexmk_use_xelatex: true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: bsde31-pdf
          path: Tex/.out/BSDE_31.pdf